 // phrase group from actual clip boundaries; word boundaries (if provided) are separate QA

 if(lines.length>3){let q=lines.join(' ').split(' ');lines=[];now='';for(let w of q){let s=now?now+' '+w:w;if(s.length>38&&now){lines.push(now);now=w}else now=s}if(now)lines.push(now)}
 let yy=951-(lines.length-1)*32;

 txt(lines[i],540,cy,sz,IVORY,800,'center')}
 K.restore()}

 let id=8;for(let i=0;i<9;i++)if(t<D.scenes[String(i)].end||i===8){id=i;break}

 SCENES[id](t,u);caption(t);footnote()}
