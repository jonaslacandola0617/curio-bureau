<style>/*LOCAL_FONTS*/html,body{background:#12242a;margin:0;color:#efe9d9;font:14px "Manrope",sans-serif}main{max-width:640px;margin:0 auto;padding:16px}canvas{display:block;width:min(100%,540px);aspect-ratio:9/16;margin:auto;box-shadow:0 22px 80px #080e14cc}button,input{accent-color:#d7ae48;margin:10px;cursor:pointer}button{border:1px solid #d7ae48;background:#10252b;color:#f5eddd;padding:8px 12px}p{line-height:1.55;color:#b3bbb9}</style></head><body><main>

<p>16s original Curio Bureau motion-direction test; source images with individual credits in SOURCES.md. Museum-display photograph is modern, not a wartime photograph. Half-track and radio imagery are equipment-type references, not verified items used by the 23rd. Map is explicitly schematic.</p></main><script>

const C={ink:"#18272d",ivory:"#eee8d8",navy:"#0d1c2b",gold:"#d7ae48",coral:"#b56b5c",olive:"#657262",blue:"#5c8c99",off:"#faf6ee",paper:"#d4c4a4",grey:"#75817e"};
const imgs={},names=["tank","halftrack","radio"];let ready=false,time=0,playing=false,prev=0;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),mix=(a,b,u)=>a+(b-a)*u;
const ease=v=>{v=clamp(v);return v*v*(3-2*v)},dec=v=>1-Math.pow(1-clamp(v),3);
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
function line(x,y,ex,ey,col=C.ink,th=2){g.beginPath();g.moveTo(x,y);g.lineTo(ex,ey);g.strokeStyle=col;g.lineWidth=th;g.stroke()}
function txt(str,x,y,size=32,col=C.ink,family="Manrope",weight=700,align="left"){g.fillStyle=col;g.textAlign=align;g.font=weight+" "+size+"px '"+family+"'";g.fillText(str,x,y);g.textAlign="left"}
function circle(x,y,r,fill,stroke="",th=2){g.beginPath();g.arc(x,y,r,0,PI*2);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.lineWidth=th;g.strokeStyle=stroke;g.stroke()}}
function ellipse(x,y,rx,ry,col,th=3){g.beginPath();g.ellipse(x,y,rx,ry,-.06,0,PI*2);g.strokeStyle=col;g.lineWidth=th;g.stroke()}
function ptsline(P,part=1,color=C.gold,width=5){let n=clamp(part)*(P.length-1),j=Math.floor(n);if(n<=0)return;g.beginPath();g.moveTo(...P[0]);for(let i=1;i<=j;i++)g.lineTo(...P[i]);if(j+1<P.length){let f=n-j;g.lineTo(mix(P[j][0],P[j+1][0],f),mix(P[j][1],P[j+1][1],f))}g.lineWidth=width;g.strokeStyle=color;g.lineCap="round";g.lineJoin="round";g.stroke()}
function drawCover(img,x,y,w,h,zoom=1,fx=.5,fy=.5){if(!img||!img.complete||!img.naturalWidth)return;let sw=img.naturalWidth,sh=img.naturalHeight,target=w/h,source=sw/sh,ow,oh;if(source>target){oh=sh;ow=sh*target}else{ow=sw;oh=sw/target}ow/=zoom;oh/=zoom;const sx=clamp(fx*sw-ow/2,0,sw-ow),sy=clamp(fy*sh-oh/2,0,sh-oh);g.drawImage(img,sx,sy,ow,oh,x,y,w,h)}
function maskedPhoto(img,x,y,w,h,zoom=1,fx=.5,fy=.5,shadow=true){g.save();if(shadow){g.shadowColor="#050d10aa";g.shadowBlur=30;g.shadowOffsetY=20}g.fillStyle=C.ivory;g.fillRect(x,y,w,h);g.shadowBlur=0;g.shadowOffsetY=0;g.beginPath();g.rect(x,y,w,h);g.clip();drawCover(img,x,y,w,h,zoom,fx,fy);g.restore()}
function fadeBottom(y=1250){let z=g.createLinearGradient(0,y,0,1920);z.addColorStop(0,"#18272d00");z.addColorStop(.36,"#18272dc8");z.addColorStop(1,"#18272d");rect(0,y,1080,1920-y,z)}

 }

function terrain(t){for(let i=0;i<10;i++){const off=i*50;g.beginPath();g.moveTo(-30,1220+off);for(let x=0;x<=1110;x+=22){let y=1220+off+16*Math.sin(x/70+i*.63)+10*Math.sin(x/28+i);g.lineTo(x,y)}g.strokeStyle="rgba(160,179,173,"+(.035+i*.003)+")";g.lineWidth=2;g.stroke()}}

 }

window.renderAt=function(t){time=clamp(t,0,16);g.save();g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);if(time<3.2)frame1(time);else if(time<6.2)frame2(time);else if(time<9.2)frame3(time);else if(time<12.8)frame4(time);else frame5(time);g.restore();document.getElementById("clock").textContent="00:"+String(Math.floor(time)).padStart(2,"0");document.getElementById("slider").value=time}
function seek(t){playing=false;window.renderAt(t)}
function toggle(){playing=!playing;prev=performance.now();if(playing)requestAnimationFrame(step)}
function step(now){if(!playing)return;time=clamp(time+Math.min(.06,(now-prev)/1000),0,16);prev=now;window.renderAt(time);if(time<16)requestAnimationFrame(step);else playing=false}
Promise.all(names.map(n=>new Promise((ok,no)=>{let im=new Image();im.onload=()=>{imgs[n]=im;ok()};im.onerror=()=>no(Error("Could not load image "+n));im.src="./assets/"+n+".jpg";}))).then(()=>document.fonts.ready).then(()=>{ready=true;window.renderReady=true;window.renderAt(0)}).catch(e=>{console.error(e);document.body.insertAdjacentText("beforeend","Asset error: "+e.message)});
