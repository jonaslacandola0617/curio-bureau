name: Curio Bureau — Samoa editorial film master
on:
  push:
    branches: [film/samoa-day-disappeared]
    paths:
      - 'films/samoa-2011/vox/**'
      - 'films/samoa-2011/assets/**'
      - 'scripts/build-vox.mjs'
      - 'scripts/prepare-geography.mjs'
      - 'scripts/synthesize-captioned.py'
      - 'scripts/render-deterministic.mjs'
      - 'scripts/render-html.mjs'
      - '.github/workflows/samoa-final.yml'
  workflow_dispatch:
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 37
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual browser, fonts dependencies and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          pip install edge-tts==7.2.3
      - name: Generate actual spoken-word timing and captions
        run: python scripts/synthesize-captioned.py
      - name: Prepare Natural Earth geographic features
        run: node scripts/prepare-geography.mjs
      - name: Compose editorial film with captions, assets and SFX
        run: node scripts/build-vox.mjs
      - name: Render synchronized voiced WebM
        env:
          CURIO_HTML: dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.html
          CURIO_VOICE: dist/samoa-2011/narration.wav
          CURIO_OUTPUT: dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.webm
        run: node scripts/render-html.mjs
      - name: Render native-crisp deterministic 1080x1920/30fps H264 master
        env:
          CURIO_HTML: dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.html
          CURIO_WEBM: dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.webm
          CURIO_MP4: dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.mp4
        run: node scripts/render-deterministic.mjs
      - name: FFprobe and mandatory caption/audio QA
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,width,height,r_frame_rate,sample_rate,channels -of json dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.mp4 | tee dist/samoa-2011/master-probe.json
          test "$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.mp4 | cut -d. -f1)" -ge 63
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.mp4 | grep '^1080,1920$'
          ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.mp4 | grep '^30/1$'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.mp4 | grep '^aac$'
          ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate,channels -of csv=p=0 dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.mp4 | grep '^48000,2$'
          test "$(grep -c ' --> ' dist/samoa-2011/captions.srt)" -ge 35
      - name: Measure soundtrack loudness and peak
        run: |
          ffmpeg -i dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.mp4 -af ebur128=peak=true -f null - 2> dist/samoa-2011/loudness.log
          tail -n 22 dist/samoa-2011/loudness.log
          grep -q 'Integrated loudness' dist/samoa-2011/loudness.log
      - name: Produce editorial frame review contact sheet
        run: |
          ffmpeg -y -v error -pattern_type glob -framerate 1 -i 'dist/samoa-2011/qa-frames/frame-*.png' -vf "scale=216:384,tile=5x8" -frames:v 1 dist/samoa-2011/frame-review.jpg
      - name: Commit visual QA evidence to project branch
        run: |
          mkdir -p films/samoa-2011/review
          cp dist/samoa-2011/frame-review.jpg films/samoa-2011/review/contact-sheet.jpg
          cp dist/samoa-2011/qa-frames/frame-000000.png films/samoa-2011/review/opening.png
          cp dist/samoa-2011/qa-frames/frame-001603.png films/samoa-2011/review/geography.png
          cp dist/samoa-2011/qa-frames/frame-005103.png films/samoa-2011/review/statute.png
          cp dist/samoa-2011/qa-frames/frame-006396.png films/samoa-2011/review/final-frame.png
          git config user.name "Curio Bureau QA"
          git config user.email "actions@users.noreply.github.com"
          git add films/samoa-2011/review
          git commit -m "QA frames: inspect actual opener, cartography, statute, end card and full contact sheet"
          git push origin HEAD:film/samoa-day-disappeared
      - name: Remove intermediates from public artifact
        run: |
          rm -f dist/samoa-2011/part-*.wav dist/samoa-2011/voice-*.mp3 dist/samoa-2011/parts.txt
          rm -f dist/samoa-2011/narration.wav
          rm -f dist/samoa-2011/geography.json
      - name: Upload release candidate files including QA samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curio-bureau-samoa-v2-qa
          path: |
            dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.html
            dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.webm
            dist/samoa-2011/Curio_Bureau_Samoa_Vox_Editorial.mp4
            dist/samoa-2011/captions.srt
            dist/samoa-2011/master-probe.json
            dist/samoa-2011/loudness.log
            dist/samoa-2011/frame-review.jpg
            dist/samoa-2011/qa-frames/*.png
          if-no-files-found: warn
          retention-days: 45
