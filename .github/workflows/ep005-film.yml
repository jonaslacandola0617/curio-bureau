name: EP005 Boston Molasses - 4K Production
on:
  push:
    branches: [film/boston-molasses-1919]
    paths:
      - .github/workflows/ep005-film.yml
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install creative render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev
          python -m pip install --user numpy scipy soundfile pillow edge-tts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install native Cairo canvas renderer
        run: |
          npm install --no-save --no-package-lock canvas@3.2.0
      - name: Acquire exact Curio Bureau typography
        run: |
          D=films/boston-molasses-1919/fonts
          mkdir -p "$D"
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf' -o "$D/PlayfairDisplay.ttf"
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf' -o "$D/Manrope.ttf"
          curl -fL 'https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/OFL.txt' -o "$D/Playfair_LICENSE.txt"
          curl -fL 'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/OFL.txt' -o "$D/Manrope_LICENSE.txt"
          test "$(stat -c%s "$D/PlayfairDisplay.ttf")" -gt 40000
          test "$(stat -c%s "$D/Manrope.ttf")" -gt 40000
      - name: Acquire verified United States public domain 1919 archival photos
        shell: bash
        run: |
          set -eux
          D=films/boston-molasses-1919/assets
          mkdir -p "$D"
          # Boston Public Library original panoramic historical photograph,
          # US public domain: https://commons.wikimedia.org/wiki/File:BostonMolassesDisaster.jpg
          curl -fL --retry 3 --retry-delay 2 'https://live.staticflickr.com/4078/4901555337_df6b3065eb_o.jpg' -o "$D/aerial.jpg" || \
          curl -fL --retry 2 --retry-delay 2 'https://commons.wikimedia.org/wiki/Special:FilePath/BostonMolassesDisaster.jpg' -o "$D/aerial.jpg"
          # Boston Elevated Railway / Boston City Archives 1919 photo, public domain
          URL='https://commons.wikimedia.org/wiki/Special:FilePath/Boston_Elevated_Railway_after_the_Molasses_Flood%2C_January_1919%2C_from_the_City_of_Boston_Archives_-_9800-018-023.jpg'
          curl -fL --retry 3 --retry-delay 2 "$URL" -o "$D/after.jpg" || cp "$D/aerial.jpg" "$D/after.jpg"
          python - <<'PY'
          from PIL import Image
          import os
          d='films/boston-molasses-1919/assets'
          for f in ('aerial.jpg','after.jpg'):
             with Image.open(os.path.join(d,f)) as im:
                im.verify()
             with Image.open(os.path.join(d,f)) as im:
                print('ARCHIVE',f,im.size)
          PY
      - name: Create natural neural narration, word timings, SRT, original score, SFX and master audio
        run: |
          cd films/boston-molasses-1919
          python scripts/audio_ep005.py
          python - <<'PY'
          import pathlib,json
          p=pathlib.Path('out/captions.json')
          pathlib.Path('out/captions.js').write_text('window.CURIO005_CAPTIONS = '+json.dumps(json.loads(p.read_text()),ensure_ascii=False)+';')
          print('CAPTION-CUES',len(json.loads(p.read_text())))
          PY
      - name: Render all 2280 exact native 4K frames and video
        run: |
          node films/boston-molasses-1919/scripts/render_ep005.js
      - name: Generate browser convenience WebM with VP9 and synchronized Opus
        run: |
          cd films/boston-molasses-1919/out
          ffmpeg -hide_banner -loglevel error -y \
            -i Curio_Bureau_EP005_4K_CANDIDATE.mp4 \
            -c:v libvpx-vp9 -row-mt 1 -cpu-used 6 -threads 4 -tile-columns 2 \
            -crf 27 -b:v 0 -pix_fmt yuv420p \
            -c:a libopus -b:a 256k -ar 48000 -ac 2 \
            Curio_Bureau_EP005_4K_WEBM.webm
      - name: Technical, caption and asset verification
        run: |
          cd films/boston-molasses-1919
          python - <<'PY'
          import json,subprocess,pathlib,sys
          d=pathlib.Path('out')
          films=[d/'Curio_Bureau_EP005_4K_CANDIDATE.mp4',d/'Curio_Bureau_EP005_4K_WEBM.webm']
          results={}
          for f in films:
             assert f.stat().st_size>3_000_000,(f,'file too small')
             z=json.loads(subprocess.run(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(f)],
                              check=True,capture_output=True,text=True).stdout)
             video=next(s for s in z['streams'] if s['codec_type']=='video')
             audio=next(s for s in z['streams'] if s['codec_type']=='audio')
             assert video['width']==2160 and video['height']==3840
             assert video['r_frame_rate']=='30/1'
             assert int(audio['sample_rate'])==48000
             assert int(audio['channels'])==2
             dur=float(z['format']['duration'])
             assert 75.7<dur<76.4,(f,dur)
             results[f.name]={'width':video['width'],'height':video['height'],'fps':video['r_frame_rate'],
                          'duration':dur,'audio':audio['codec_name'],'bytes':f.stat().st_size}
          cues=json.loads((d/'captions.json').read_text())
          assert 15<len(cues)<120 and all(0<=c['start']<c['end']<=76 for c in cues)
          assert (d/'captions.srt').stat().st_size>500
          (d/'qa'/'technical_qa.json').write_text(json.dumps(results,indent=2))
          print('ENCODES VERIFIED',json.dumps(results,indent=2))
          PY
          ffmpeg -hide_banner -i out/Curio_Bureau_EP005_4K_CANDIDATE.mp4 \
            -af loudnorm=I=-13.5:TP=-1.5:LRA=9:print_format=json -vn \
            -f null - 2>out/qa/audio_loudness_report.txt
          python - <<'PY'
          from PIL import Image,ImageOps,ImageDraw
          import pathlib,math
          p=pathlib.Path('out/qa')
          files=sorted(p.glob('frame_*.jpg'))
          assert len(files)>=12,len(files)
          cell=(240,426); cols=5;rows=math.ceil(len(files)/cols)
          canvas=Image.new('RGB',(cols*cell[0],rows*(cell[1]+35)),(8,22,34))
          d=ImageDraw.Draw(canvas)
          for i,f in enumerate(files):
             im=Image.open(f);im=ImageOps.fit(im,cell)
             x=(i%cols)*cell[0];y=(i//cols)*(cell[1]+35)
             canvas.paste(im,(x,y));d.text((x+8,y+cell[1]+5),f.stem,fill=(245,240,231))
          canvas.save(p/'CONTACT_SHEET.jpg',quality=87)
          print('QA contact sheet',canvas.size)
          PY
      - name: Pack studio and required episode documents
        run: |
          cd films/boston-molasses-1919
          mkdir -p out/production_package
          cp -r studio scripts assets fonts out/production_package/
          cp out/captions.json out/captions.js out/captions.srt \
             out/master_mix.mp3 out/voice_timing.json out/word_boundaries.json \
             out/production_package/
          cat >out/production_package/README.txt <<'TEXT'
          CURIO BUREAU EPISODE 005 / THE GREAT BOSTON MOLASSES FLOOD
          Web studio entry: studio/index.html
          Audio: natural neural narrator, original harmonically-composed score,
          bespoke motion synchronized sound effects.
          Source: original JS Canvas deterministic 2160x3840 30fps graphics.
          Original archival photographs: BPL / Boston City Archives archival public-domain
          images, see production source and copyright details.
          Render version is a QUALITY CANDIDATE awaiting full human creative review.
          TEXT
          cd out
          zip -qr Curio_Bureau_EP005_STUDIO_SOURCE.zip production_package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EP005-Boston-Molasses-4K-Production
          path: |
            films/boston-molasses-1919/out/Curio_Bureau_EP005_4K_CANDIDATE.mp4
            films/boston-molasses-1919/out/Curio_Bureau_EP005_4K_WEBM.webm
            films/boston-molasses-1919/out/Curio_Bureau_EP005_STUDIO_SOURCE.zip
            films/boston-molasses-1919/out/qa/CONTACT_SHEET.jpg
            films/boston-molasses-1919/out/qa/technical_qa.json
            films/boston-molasses-1919/out/qa/audio_loudness_report.txt
            films/boston-molasses-1919/out/captions.srt
            films/boston-molasses-1919/out/voice_timing.json
          if-no-files-found: warn
          retention-days: 7
