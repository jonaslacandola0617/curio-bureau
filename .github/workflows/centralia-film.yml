name: Curio Bureau 002 — Centralia editorial film
on:
  push:
    branches: [film/centralia-underground-fire]
    paths:
      - 'films/centralia-1962/studio/**'
      - 'films/centralia-1962/assets/**'
      - 'scripts/build-centralia.mjs'
      - 'scripts/prepare-centralia-map.mjs'
      - 'scripts/synthesize-centralia.py'
      - 'scripts/render-centralia-webm.mjs'
      - 'scripts/render-centralia-master.mjs'
      - '.github/workflows/centralia-film.yml'
  workflow_dispatch:
concurrency:
  group: centralia-film-production
  cancel-in-progress: true
jobs:
  master:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout editable project source
        uses: actions/checkout@v4
      - name: Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python toolchain
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg, Chromium, and neural narration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          pip install edge-tts==7.2.3
      - name: Build 64-second neural narration and speech-aligned SRT
        run: python scripts/synthesize-centralia.py
      - name: Fetch real Pennsylvania state geometry
        run: node scripts/prepare-centralia-map.mjs
      - name: Build standalone editorial HTML with all assets and voice embedded
        run: node scripts/build-centralia.mjs
      - name: Export voiced, captioned and sound-designed WebM
        env:
          CURIO_HTML: dist/centralia-1962/Curio_Bureau_Centralia_Editorial.html
          CURIO_VOICE: dist/centralia-1962/narration.wav
          CURIO_OUTPUT: dist/centralia-1962/Curio_Bureau_Centralia_Editorial.webm
        run: node scripts/render-centralia-webm.mjs
      - name: Encode deterministic 1080x1920 H.264 master, frame-check typography
        env:
          CURIO_HTML: dist/centralia-1962/Curio_Bureau_Centralia_Editorial.html
          CURIO_WEBM: dist/centralia-1962/Curio_Bureau_Centralia_Editorial.webm
          CURIO_MP4: dist/centralia-1962/Curio_Bureau_Centralia_Editorial.mp4
        run: node scripts/render-centralia-master.mjs
      - name: Verify frame rate, quality, codecs, exact duration, captions, stereo audio
        run: |
          set -euo pipefail
          FILE=dist/centralia-1962/Curio_Bureau_Centralia_Editorial.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,sample_rate,channels -of json "$FILE" | tee dist/centralia-1962/master-probe.json
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=p=0 "$FILE" | grep -Fx '1080,1920'
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$FILE" | grep -Fx 'h264'
          ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$FILE" | grep -Fx '30/1'
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$FILE" | grep -Fx 'aac'
          ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate,channels -of csv=p=0 "$FILE" | grep -Fx '48000,2'
          test "$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FILE" | cut -d. -f1)" -ge 63
          test "$(grep -c ' --> ' dist/centralia-1962/captions.srt)" -ge 35
          grep -q 'The fire' dist/centralia-1962/captions.srt
      - name: Measure mastered music, narration and SFX audio
        run: |
          ffmpeg -hide_banner -i dist/centralia-1962/Curio_Bureau_Centralia_Editorial.mp4 -af ebur128=peak=true -f null - 2> dist/centralia-1962/loudness.log
          tail -n 19 dist/centralia-1962/loudness.log
          grep -q 'Integrated loudness' dist/centralia-1962/loudness.log
      - name: Produce frame review contact sheet and source-linked previews
        run: |
          ffmpeg -hide_banner -loglevel error -y -pattern_type glob -framerate 1 -i 'dist/centralia-1962/qa-frames/frame-*.png' -vf 'scale=216:384,tile=5x8' -frames:v 1 dist/centralia-1962/frame-review.jpg
          mkdir -p films/centralia-1962/review/approved
          for spec in "000000 opening" "000400 opening-calendar" "001800 underground" "002600 attempts" "003600 road" "004600 relocation" "005400 present" "006396 final-frame"; do
            set -- $spec
            src=dist/centralia-1962/qa-frames/frame-$1.png
            if test -f "$src"; then
              ffmpeg -hide_banner -loglevel error -y -i "$src" -vf 'scale=520:-2' -q:v 6 -frames:v 1 "/tmp/curio-$2.jpg"
              base64 -w0 "/tmp/curio-$2.jpg" > "films/centralia-1962/review/approved/$2.base64.txt"
            fi
          done
          ffmpeg -hide_banner -loglevel error -y -i dist/centralia-1962/frame-review.jpg -vf 'scale=630:-2' -q:v 6 -frames:v 1 /tmp/curio-contact.jpg
          base64 -w0 /tmp/curio-contact.jpg > films/centralia-1962/review/approved/contact-sheet.base64.txt
          cp dist/centralia-1962/captions.srt films/centralia-1962/review/approved/captions.srt
          git config user.name "Curio Bureau QA"
          git config user.email "actions@users.noreply.github.com"
          git add films/centralia-1962/review/approved/
          git commit -m 'Centralia: published render frame samples, timed captions, editorial QA' || exit 0
          git fetch origin film/centralia-underground-fire
          git rebase FETCH_HEAD
          git push origin HEAD:film/centralia-underground-fire
      - name: Remove work files not part of downloadable delivery
        run: |
          rm -f dist/centralia-1962/part-*.wav dist/centralia-1962/voice-*.mp3 dist/centralia-1962/parts.txt
          rm -f dist/centralia-1962/narration.wav dist/centralia-1962/narration-embedded.mp3 dist/centralia-1962/geography.json
      - name: Upload all playable video deliverables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curio-bureau-centralia-002-editorial
          path: |
            dist/centralia-1962/Curio_Bureau_Centralia_Editorial.mp4
            dist/centralia-1962/Curio_Bureau_Centralia_Editorial.webm
            dist/centralia-1962/Curio_Bureau_Centralia_Editorial.html
            dist/centralia-1962/captions.srt
            dist/centralia-1962/frame-review.jpg
            dist/centralia-1962/master-probe.json
            dist/centralia-1962/loudness.log
            dist/centralia-1962/qa-frames/*.png
          if-no-files-found: warn
          retention-days: 45
