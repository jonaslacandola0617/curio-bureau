name: EP009 Ghost Army | full native-4K encoded MP4 and WebM (REVIEW)
on:
  workflow_dispatch:
  push:
    branches: [film/ghost-army-1945]
    paths:
      - .github/workflows/ep009-ghost-army-full-film.yml
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Verify art preflight exists on this same film branch
        run: |
          test -s films/ghost-army-1945/review/EP009_SHOT_PREFLIGHT_CONTACT.jpg
          grep -q '"native4k": true' films/ghost-army-1945/review/EP009_PREFLIGHT_QA.json
      - name: Install audio and animation dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fluidsynth fluid-soundfont-gm fontconfig
          python -m pip install --disable-pip-version-check -q numpy soundfile edge-tts mido Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Obtain render-only fonts, never include in user downloads
        run: |
          mkdir -p films/ghost-army-1945/assets
          cd films/ghost-army-1945/assets
          curl -fL --retry 5 --retry-delay 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf' -o PlayfairDisplay.ttf
          curl -fL --retry 5 --retry-delay 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/manrope/Manrope%5Bwght%5D.ttf' -o Manrope.ttf
          test "$(stat -c%s PlayfairDisplay.ttf)" -gt 50000
          test "$(stat -c%s Manrope.ttf)" -gt 50000
      - name: Produce real speech, voice A/B, score and original SFX
        run: |
          set -euo pipefail
          python -u films/ghost-army-1945/src/build_audio.py
          ffmpeg -hide_banner -i films/ghost-army-1945/audio/voice_24bit.wav -af 'silencedetect=noise=-37dB:d=0.85' -f null - 2>films/ghost-army-1945/audio/voice_silence_detection.txt
          cat films/ghost-army-1945/audio/voice_gap_QA.json
      - name: Native-4K lossless image frame pipe, MP4 and separate WebM encodes
        run: |
          set -euo pipefail
          python -u films/ghost-army-1945/src/render.py
          cat films/ghost-army-1945/dist/ENCODE_QA.json
      - name: Verify actual codecs, 2160x3840, sound rate, ending frames and parity
        run: |
          cat >/tmp/check.py <<'PY'
          import pathlib,json,subprocess
          d=pathlib.Path('films/ghost-army-1945/dist');out={}
          for ext,v,a in [('mp4','h264','aac'),('webm','vp9','opus')]:
            p=d/('CURIO_BUREAU_EP009_NATIVE4K_'+ext.upper()+'_REVIEW.'+ext)
            assert p.is_file() and p.stat().st_size>1000000,p
            x=json.loads(subprocess.run(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(p)],capture_output=True,text=True,check=True).stdout)
            vid=next(y for y in x['streams'] if y['codec_type']=='video')
            aud=next(y for y in x['streams'] if y['codec_type']=='audio')
            assert (vid['width'],vid['height'],vid['r_frame_rate'],vid['codec_name'],aud['codec_name'])==(2160,3840,'30/1',v,a)
            assert int(aud['sample_rate'])==48000
            subprocess.run(['ffmpeg','-v','error','-sseof','-2','-i',str(p),'-frames:v','1','-f','null','-'],check=True)
            out[p.name]=dict(size_bytes=p.stat().st_size,duration=float(x['format']['duration']),codecs=[v,a],pixel_size=[2160,3840],fps=30)
          vals=[z['duration'] for z in out.values()]
          assert max(vals)-min(vals)<.22
          (d/'INDEPENDENT_STREAM_QA.json').write_text(json.dumps({'status':'STREAM_FORMAT_PASS; CREATIVE_FINAL_GATES_OPEN','files':out,'outstanding':['owner headphone+phone audio audition','word-level caption align','full moving-film creative approval','score/SFX rights check']},indent=2))
          print(json.dumps(out,indent=2))
          PY
          python /tmp/check.py
      - name: Quantify actual encoded output integrated loudness and sample peaks
        run: |
          python - <<'PY'
          import json,re,subprocess,pathlib
          root=pathlib.Path('films/ghost-army-1945/dist')
          r={}
          for ext in ['mp4','webm']:
            p=root/f'CURIO_BUREAU_EP009_NATIVE4K_{ext.upper()}_REVIEW.{ext}'
            q=subprocess.run(['ffmpeg','-hide_banner','-nostats','-i',str(p),'-vn','-af','ebur128=peak=true','-f','null','-'],capture_output=True,text=True,check=True)
            output=q.stderr
            i=list(re.finditer(r'Integrated loudness:\s*I:\s*(-?\d+(?:\.\d+)?) LUFS',output))
            peak=list(re.finditer(r'True peak:\s*Peak:\s*(-?\d+(?:\.\d+)?) dBFS',output))
            if not i:raise RuntimeError(f'No measured integrated loudness for {p}')
            val=float(i[-1].group(1));pk=float(peak[-1].group(1)) if peak else None
            if not(-15<val<-10.0):raise RuntimeError(f'Audio master loudness outside intended window: {p}: {val}')
            if pk is not None and pk>-.10:raise RuntimeError(f'True peak likely clipping: {p}: {pk}')
            r[ext]={'measured_integrated_LUFS':val,'true_peak_dBFS':pk,'method':'ffmpeg ebur128=peak=true applied to decoded actual export'}
          (root/'R2_AUDIO_LOUDNESS_QA.json').write_text(json.dumps({'audio_r2':r,'voice_and_SFX_relative_gain_dB':3.0,'target_integrated_LUFS':-12,'human_listening_signoff':'PENDING'},indent=2))
          print(json.dumps(r,indent=2))
          PY
      - name: Publish direct-review MP4, WebM and editable source files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          D=films/ghost-army-1945/dist
          gh release create ep009-ghost-army-review-r2 \
            "$D/CURIO_BUREAU_EP009_NATIVE4K_MP4_REVIEW.mp4" \
            "$D/CURIO_BUREAU_EP009_NATIVE4K_WEBM_REVIEW.webm" \
            "$D/CURIO_BUREAU_EP009_SOURCE_REVIEW.zip" \
            "$D/EP009_NATIVE4K_CONTACT_SHEET.jpg" \
            "$D/ENCODE_QA.json" \
            "$D/INDEPENDENT_STREAM_QA.json" \
            "$D/R2_AUDIO_LOUDNESS_QA.json" \
            films/ghost-army-1945/audio/audio_cue_sheet.csv \
            films/ghost-army-1945/audio/AUDIO_MIX_REVISION_R2.json \
            films/ghost-army-1945/audio/VOICE_AUDITION_OPEN_A.mp3 \
            films/ghost-army-1945/audio/VOICE_AUDITION_OPEN_B.mp3 \
            --repo jonaslacandola0617/curio-bureau \
            --target film/ghost-army-1945 \
            --prerelease \
            --title 'Curio Bureau 009 - The Army That Was Not There - Native4K REVIEW R2' \
            --notes 'US Ghost Army history based on U.S. Army/National WWII Museum. Original WWII illustrative animation, recorded TTS, original composed score and 16 owned synthesised SFX cues. Actual native 2160x3840 30fps H.264/AAC and VP9/Opus files separately verified. R2 IMPROVEMENTS: unified translucent single-panel captions matching 008; voice and owned SFX mix +3dB relative to score, safer -12 LUFS / -1 dBTP target. REVIEW CANDIDATE, NOT FINAL: human emotional voice review, source rights/music checks, true word-aligned captions and full phone/headphone moving-film creative QA remain open. No authentic 1945 audio or footage is implied.'
      - name: Preserve native-4K renders
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: curio-009-ghost-army-actual-native4k-review
          path: |
            films/ghost-army-1945/dist/CURIO_BUREAU_EP009_NATIVE4K_MP4_REVIEW.mp4
            films/ghost-army-1945/dist/CURIO_BUREAU_EP009_NATIVE4K_WEBM_REVIEW.webm
            films/ghost-army-1945/dist/CURIO_BUREAU_EP009_SOURCE_REVIEW.zip
            films/ghost-army-1945/dist/EP009_NATIVE4K_CONTACT_SHEET.jpg
            films/ghost-army-1945/dist/ENCODE_QA.json
            films/ghost-army-1945/dist/INDEPENDENT_STREAM_QA.json
            films/ghost-army-1945/audio/audio_cue_sheet.csv
          retention-days: 30
          if-no-files-found: error
