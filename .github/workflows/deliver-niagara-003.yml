name: Deliver Curio Bureau 003 — Niagara production master
on:
  push:
    branches: [film/niagara-1969-dewatering]
    paths: ['.github/workflows/deliver-niagara-003.yml']
  workflow_dispatch:
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout final Niagara film source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the exact QA-passed video revision
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GH_REPO/actions/runs/38031337273" --jq '.conclusion')" = 'success'
          test "$(gh api "repos/$GH_REPO/actions/runs/38031337273" --jq '.head_sha')" = '33fe882db13c71bb7d1021d3ecf9e6a58e4bb533'
      - name: Fetch all finished video/audio assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/niagara-final
          gh run download 38031337273 --repo "$GH_REPO" --name curio-bureau-niagara-003-editorial --dir /tmp/niagara-final
          for f in Curio_Bureau_Niagara_1969_Editorial.mp4 Curio_Bureau_Niagara_1969_Editorial.webm Curio_Bureau_Niagara_1969_Editorial.html captions.srt speech-audit.json frame-review.jpg master-probe.json loudness.log; do
            test -s "/tmp/niagara-final/$f" || { echo "Required production file missing: $f"; exit 1; }
          done
          test "$(grep -c ' --> ' /tmp/niagara-final/captions.srt)" -ge 32
          grep -q '"recorded_speed_ratios"' /tmp/niagara-final/speech-audit.json
          ls -lh /tmp/niagara-final/*.mp4 /tmp/niagara-final/*.webm /tmp/niagara-final/*.html
      - name: Publish independently downloadable binaries on permanent episode delivery branch
        run: |
          set -euo pipefail
          git switch -c delivery/niagara-003
          OUT=deliverables/niagara-003
          mkdir -p "$OUT"
          cp /tmp/niagara-final/Curio_Bureau_Niagara_1969_Editorial.mp4 "$OUT/"
          cp /tmp/niagara-final/Curio_Bureau_Niagara_1969_Editorial.webm "$OUT/"
          cp /tmp/niagara-final/Curio_Bureau_Niagara_1969_Editorial.html "$OUT/"
          cp /tmp/niagara-final/captions.srt "$OUT/"
          cp /tmp/niagara-final/speech-audit.json "$OUT/"
          cp /tmp/niagara-final/frame-review.jpg "$OUT/"
          cp /tmp/niagara-final/master-probe.json "$OUT/"
          cp /tmp/niagara-final/loudness.log "$OUT/"
          cat > "$OUT/README.md" <<'EOF'
          # CURIO BUREAU 003 — THE WATERFALL THEY SWITCHED OFF

          This is the final QA-passed 1969 **American Falls** documentary. Horseshoe Falls is never represented as dry.

          - `Curio_Bureau_Niagara_1969_Editorial.mp4` — upload-ready 1080 × 1920, 30 FPS, H.264, AAC stereo, 64 seconds. Captions burned into picture.
          - `Curio_Bureau_Niagara_1969_Editorial.webm` — complete alternative voiced film with original composed water sound, music and owner Drive effects.
          - `Curio_Bureau_Niagara_1969_Editorial.html` — standalone interactive editorial Canvas studio, embedded photograph, animations, narration and all selected FX with seek/play/replay/Export WebM controls.
          - `captions.srt` — 33 real word-aligned subtitle groups.
          - `speech-audit.json` — every narration scene recorded and rendered at 1.0x speed, without forced atempo.
          - `frame-review.jpg`, `master-probe.json`, `loudness.log` — exported-pixel and media QA evidence.

          **Actual approved render**: https://github.com/jonaslacandola0617/curio-bureau/actions/runs/38031337273

          **Production source branch**: film/niagara-1969-dewatering, source revision 33fe882db13c71bb7d1021d3ecf9e6a58e4bb533.

          **Photo attribution**: Bob Linsdell, *American Falls, Niagara Falls (470587) (9447240371)*, CC BY 2.0; cropped, color graded and motion-composited.
          https://commons.wikimedia.org/wiki/File:American_Falls,_Niagara_Falls_(470587)_(9447240371).jpg
          https://creativecommons.org/licenses/by/2.0/

          Modern flowing-water photograph; NOT misrepresented as 1969 archival footage. Dry-falls geological graphic is an original explanatory illustration. 1975 IJC document card is retypeset, and its recommendation paraphrased, not quoted verbatim.

          Historical sources:
          https://www.dvidshub.net/news/326866/buffalo-district-recalls-the-dewatering-of-the-american-falls
          https://ijc.org/en/preservation-and-enhancement-american-falls-niagara

          The video passed computational frame QA and -14 LUFS-class loudness analysis. A human audio listening audition was not available; inspect the audio before publicly releasing it.
          EOF
          git config user.name "Curio Bureau Release Engineering"
          git config user.email "actions@users.noreply.github.com"
          git add "$OUT"
          git commit -m "Deliver Niagara 003 QA-approved MP4, WebM, HTML, word SRT and review evidence"
          git push origin HEAD:refs/heads/delivery/niagara-003
          echo "DELIVERY SUCCESS: delivery/niagara-003"
