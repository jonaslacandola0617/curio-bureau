name: Immune defense native motion repair v2
on:
  push:
    branches: ['film/immune-defense-sepsis']
    paths:
      - 'production/episodes/immune-defense-sepsis/motion-v2/READY.json'
      - '.github/workflows/immune-defense-motion-v2.yml'
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_COMMIT: ${{ github.sha }}
      CURIO_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install pillow numpy scipy
          npm install --no-save @napi-rs/canvas
      - name: Validate, capture, archive and inspect full review
        run: python production/episodes/immune-defense-sepsis/motion-v2/build_repair.py
