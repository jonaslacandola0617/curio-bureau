name: Curio Ghost Army | collage V3 actual moving review
on:
  push:
    branches: [design/ghost-army-editorial-collage-v3]
    paths:
      - films/ghost-army-1945/design-tests/CURIO_GHOST_ARMY_COLLAGE_V3_PLAYER.html
      - films/ghost-army-1945/design-tests/render_v3.py
      - .github/workflows/ep009-collage-v3.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install browser Canvas capture and encode tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install -q Pillow playwright
          python -m playwright install --with-deps chromium
      - name: Render all 384 distinct frames and master 16 second MP4 with original SFX
        run: python -u films/ghost-army-1945/design-tests/render_v3.py
      - name: Persist actual viewing copy and verification report on design branch
        run: |
          set -euxo pipefail
          git config user.name 'curio-bureau-motion-review[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add films/ghost-army-1945/design-tests/rendered/CURIO_GHOST_ARMY_COLLAGE_V3_REVIEW.mp4
          git add films/ghost-army-1945/design-tests/rendered/CURIO_GHOST_ARMY_COLLAGE_V3_CONTACT.jpg
          git add films/ghost-army-1945/design-tests/rendered/V3_RENDER_QA.json
          git commit -m "render(ep009): actual 16-second V3 paper collage motion review, 24fps with SFX"
          git push origin HEAD:refs/heads/design/ghost-army-editorial-collage-v3
      - name: Attach review copy to Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ghost-army-collage-v3-playable-review
          path: |
            films/ghost-army-1945/design-tests/rendered/CURIO_GHOST_ARMY_COLLAGE_V3_REVIEW.mp4
            films/ghost-army-1945/design-tests/rendered/CURIO_GHOST_ARMY_COLLAGE_V3_CONTACT.jpg
            films/ghost-army-1945/design-tests/rendered/V3_RENDER_QA.json
          if-no-files-found: error
